# Dependabot v2 — RELEASE-MIRROR configuration.
#
# This file ships to the public repository (as .github/dependabot.yml) in
# place of the development tree's own Dependabot config. The public repo is a
# release mirror: dependency updates are reviewed and merged in the
# development tree and arrive here via sync commits — so every ecosystem
# below sets open-pull-requests-limit: 0. Dependabot stays registered (its
# jobs run and report clean) but never opens pull requests on the mirror.
#
# Forks: if you want automatic dependency PRs on your fork, raise the limits
# (or delete the open-pull-requests-limit lines) and enable Dependabot in
# your fork's settings.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
