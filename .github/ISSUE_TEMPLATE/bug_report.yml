name: Bug report
description: Report incorrect behavior, a crash, or a wrong/missing finding in stripe-audit.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. stripe-audit is **read-only** — if you believe a
        run mutated your Stripe account, treat it as a security report instead and
        use the private channel in [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
      placeholder: "Running `stripe-audit ...` reported X, but I expected Y."
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact command(s) you ran. Redact any live keys or resource ids.
      placeholder: |
        1. stripe-audit --demo --output json
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: stripe-audit version
      description: Output of `stripe-audit --version` (or the npm version you ran).
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste any console output. **Never paste a live Stripe key** — redact it.
      render: shell
    validations:
      required: false
